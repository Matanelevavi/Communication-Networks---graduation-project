name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"          # weekly: a dependency can become vulnerable without a commit

permissions:
  contents: read

jobs:
  bandit:
    name: static analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # Any finding fails the build. A deliberate exception is marked in the
      # code with `# nosec` and the reason it is safe.
      - run: bandit -r src run.py -ll -ii

  pip-audit:
    name: known vulnerabilities in dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict

  image:
    name: container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t weatherwear:scan .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: weatherwear:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
